name: LogFlux CI
on:
  push:
    branches: [ main, develop, "feature/**", "hotfix/**", "fix/**", "docs/**", "test/**", "refactor/**" ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/ingestion/go.mod
          cache-dependency-path: |
            contracts/go.sum
            services/*/go.sum
      - name: Download dependencies
        run: |
          for module in contracts services/ingestion services/logs services/projects services/alerting; do
            (cd "$module" && GOWORK=off go mod download) || exit 1
          done
      - name: Check formatting
        run: |
          files=$(gofmt -l services contracts)
          if [ -n "$files" ]; then
            echo "Format these files with gofmt:"
            echo "$files"
            exit 1
          fi
      - name: Static analysis
        run: make vet

      - name: Tests
        run: make test

      - name: Build
        run: make build
