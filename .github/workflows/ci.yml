name: LogFlux CI
on:
  push:
    branches: [ main, develop, "feature/**", "hotfix/**", "fix/**", "docs/**", "test/**", "refactor/**" ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/ingestion/go.mod
          cache-dependency-path: |
            contracts/go.sum
            services/*/go.sum
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.54.0

      - name: Download dependencies
        run: task deps

      - name: Check formatting
        run: task fmt:check

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true

      - name: Static analysis
        run: task lint

      - name: Tests
        run: task test

      - name: Build
        run: task build
